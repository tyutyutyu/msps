name: Publish PyPI

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  release-prod:
    name: Publish PyPI
    runs-on: ubuntu-latest

    environment:
      name: release-prod
      url: https://pypi.org/p/msps

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install packages
        run: uv sync

      - name: Build
        run: uv build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.1
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Get version
        run: echo "VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${VERSION}" \
            dist/** \
            --repo '${{ github.repository }}' \
            --generate-notes \
            --title "${VERSION}"

      - name: Create Pull Request to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --title "Merge release back to main" \
            --body "Auto-merge release back to main")
          echo "PR_URL=${PR_URL}" >> $GITHUB_ENV

      - name: Merge Pull Request to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr merge \
            --auto \
            --merge \
            --delete-branch \
             "${PR_URL}"
