name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'

permissions: read-all

jobs:
  release-prod:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: "!contains(github.ref, 'rc')"

    environment:
      name: release-prod
      url: https://pypi.org/p/msps

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version:      ${TAG_VERSION}"
          echo "pyproject version: ${PYPROJECT_VERSION}"
          [ "${TAG_VERSION}" = "${PYPROJECT_VERSION}" ] || { echo "Version mismatch: tag=${TAG_VERSION} pyproject=${PYPROJECT_VERSION}"; exit 1; }

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create \
            "${GITHUB_REF_NAME}" \
            dist/** \
            --repo '${{ github.repository }}' \
            --generate-notes \
            --title "${VERSION}"
