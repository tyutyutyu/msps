name: Publish to TestPyPI

on:
  workflow_dispatch: {}

permissions: read-all

jobs:
  release-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest

    environment:
      name: release-test
      url: https://test.pypi.org/p/msps

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install packages
        run: uv sync

      - name: Bump version to RC
        id: version
        run: |
          VERSION=$(uv version | awk '{print $2}')

          RC_COUNT=$(git tag -l "${VERSION}-rc.*" | wc -l)
          RC_COUNT=$((RC_COUNT + 1))

          PEP440_RC_VERSION="${VERSION}rc${RC_COUNT}"
          SEMVER_RC_VERSION="${VERSION}-rc.${RC_COUNT}"

          uv version "${PEP440_RC_VERSION}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "rc_version=${SEMVER_RC_VERSION}" >> $GITHUB_OUTPUT
          echo "pep440_rc_version=${PEP440_RC_VERSION}" >> $GITHUB_OUTPUT

          echo "Original version: ${VERSION}"
          echo "RC version (SemVer): ${SEMVER_RC_VERSION}"
          echo "RC version (PEP 440): ${PEP440_RC_VERSION}"

      - name: Build
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Create RC tag
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.rc_version }}" -m "Release candidate ${{ steps.version.outputs.rc_version }}"
          git push origin "${{ steps.version.outputs.rc_version }}"
