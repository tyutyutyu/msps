name: Publish to TestPyPI

on:
  push:
    tags:
      - 'v*rc*'

permissions: read-all

jobs:
  release-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest

    environment:
      name: release-test
      url: https://test.pypi.org/p/msps

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version:      ${TAG_VERSION}"
          echo "pyproject version: ${PYPROJECT_VERSION}"
          [ "${TAG_VERSION}" = "${PYPROJECT_VERSION}" ] || { echo "Version mismatch: tag=${TAG_VERSION} pyproject=${PYPROJECT_VERSION}"; exit 1; }

      - name: Build
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
