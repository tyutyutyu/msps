name: Publish to TestPyPI

on:
  workflow_dispatch: {}

permissions: read-all

jobs:
  release-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest

    environment:
      name: release-test
      url: https://test.pypi.org/p/msps

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: uv sync

      - name: Bump version
        run: sed -i 's/version = "\([^"]*\)"/version = "\1rc${{GITHUB_RUN_NUMBER}}"/' pyproject.toml

      - name: Build
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
